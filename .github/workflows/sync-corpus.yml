name: Sync Swedish Business Corpus to GitHub & Hugging Face

on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and build corpus from ce.se
        run: python3 scripts/build_corpus.py

      - name: Commit and push updated corpus to GitHub
        run: |
          git config user.name "CE Sweden Corpus Bot"
          git config user.email "info@ce.se"
          git add data/ README.md CATALOG.md CITATION.cff .zenodo.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(corpus): sync latest Swedish business & regulatory corpus from ce.se"
            git push
          fi

      - name: Push dataset to Hugging Face Hub
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 -c '
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "Schtumpfnagel/swedish-business-market-entry-corpus"
          api.create_repo(repo_id=repo_id, repo_type="dataset", exist_ok=True)
          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="dataset",
              ignore_patterns=[".git*", ".github*", "scripts*"],
              commit_message="Sync latest Swedish Business & Market Entry Corpus from https://www.ce.se/"
          )
          print("Successfully synced to Hugging Face:", repo_id)
          '
